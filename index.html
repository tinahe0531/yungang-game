<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="守护云冈：一款以云冈石窟文化元素为主题的记忆小游戏。" />
  <title>守护云冈 · 记忆修复</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23382920'/%3E%3Cpath d='M14 50V28c0-10 8-18 18-18s18 8 18 18v22' fill='none' stroke='%23d7a852' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23d7a852'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; --ink:#211710; --stone:#34271f; --edge:#5b4637; --gold:#e5bb67; --cream:#f5e7ca; --mist:#b9a58f; --jade:#78aaa2; --red:#bc6046; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; color:var(--cream); background:radial-gradient(circle at 50% -10%, #6a4b2e 0, #33251d 35%, #17110e 78%); }
    main { width:min(100%, 920px); margin:auto; padding:clamp(1.25rem,4vw,3.5rem) 1rem 2rem; }
    header { display:flex; gap:1rem; justify-content:space-between; align-items:flex-end; border-bottom:1px solid #7a5c3e; padding-bottom:1rem; }
    h1 { margin:0; font-family:Georgia, "Noto Serif SC", serif; font-size:clamp(2rem,7vw,4.3rem); font-weight:500; letter-spacing:.07em; line-height:1; }
    .subtitle { margin:.5rem 0 0; color:var(--mist); font-size:1rem; }
    .badge { border:1px solid var(--gold); color:var(--gold); padding:.5rem .7rem; font-size:.82rem; white-space:nowrap; }
    .scene { margin-top:1.1rem; height:clamp(135px,19vw,190px); position:relative; overflow:hidden; border:1px solid #725438; background:#211710; }
    .scene img { width:100%; height:100%; object-fit:cover; object-position:center 58%; display:block; opacity:.88; }
    .scene::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,rgba(18,12,9,.76),transparent 58%), linear-gradient(0deg,rgba(18,12,9,.55),transparent 55%); }
    .scene-caption { position:absolute; z-index:1; left:clamp(1rem,4vw,2rem); bottom:1rem; margin:0; font-family:Georgia, "Noto Serif SC", serif; font-size:clamp(1.05rem,2.7vw,1.7rem); letter-spacing:.05em; text-shadow:0 2px 8px #000; }
    .scene-caption small { display:block; margin-top:.25rem; color:#e5d1ad; font-family:"Microsoft YaHei",sans-serif; font-size:.72rem; letter-spacing:.1em; }
    .game { display:grid; grid-template-columns:1fr 230px; gap:1.2rem; margin-top:1.3rem; }
    .board { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:clamp(.5rem,1.6vw,.9rem); }
    .card { aspect-ratio:1/1.04; border:1px solid #795b40; background:linear-gradient(145deg,#4a3729,#2b211c); color:var(--cream); cursor:pointer; font:inherit; position:relative; transform-style:preserve-3d; transition:transform .33s ease, border-color .2s; padding:0; }
    .card:hover:not(:disabled) { border-color:var(--gold); transform:translateY(-2px); }
    .card:focus-visible { outline:3px solid var(--jade); outline-offset:3px; }
    .card.revealed, .card.matched { transform:rotateY(180deg); }
    .face { position:absolute; inset:0; backface-visibility:hidden; display:grid; place-items:center; }
    .back { color:var(--gold); font-family:Georgia, serif; font-size:2rem; }
    .front { transform:rotateY(180deg); background:#d9b77b; color:#2b211b; display:flex; flex-direction:column; padding:.3rem; text-align:center; overflow:hidden; }
    .front img { width:100%; min-height:0; flex:1; object-fit:cover; object-position:50% 45%; background:#4a3729; }
    .label { padding:.35rem .1rem .2rem; font-size:1rem; font-weight:700; line-height:1.2; }
    .matched .front { background:linear-gradient(135deg,#81aaa1,#dce3c6); }
    aside { background:rgba(32,23,17,.63); border:1px solid #604a38; padding:1rem; align-self:start; }
    .stat { border-bottom:1px solid #5b4636; padding:.8rem 0; display:flex; justify-content:space-between; gap:1rem; }
    .stat:first-child { padding-top:0; }
    .stat strong { color:var(--gold); font-size:1.35rem; }
    .hint { margin:1rem 0 0; min-height:5.2rem; color:#dfd0b4; line-height:1.65; font-size:.92rem; }
    .hint b { display:block; color:var(--gold); margin-bottom:.25rem; }
    button.reset { width:100%; margin-top:1rem; border:1px solid var(--gold); background:transparent; color:var(--gold); padding:.75rem; cursor:pointer; font:inherit; }
    button.reset:hover { background:var(--gold); color:var(--ink); }
    .footer { color:#a9947d; font-size:.78rem; line-height:1.6; margin:1.15rem 0 0; }
    .sources { margin-top:.75rem; color:#bba88e; font-size:.78rem; line-height:1.6; }
    .sources summary { cursor:pointer; color:var(--gold); }
    .sources a { color:#d9c59f; }
    .win { color:#d7eee9; }
    @media (max-width:680px) {
      main { padding:.85rem .75rem 1.5rem; }
      header { align-items:flex-start; }
      .badge { display:none; }
      .scene { margin-top:.75rem; height:90px; }
      .scene-caption { bottom:.55rem; }
      .scene-caption small { display:none; }
      .game { grid-template-columns:1fr; gap:.7rem; margin-top:.75rem; }
      .board { gap:.45rem; }
      .card { aspect-ratio:1/1.07; }
      .label { font-size:.875rem; }
      aside { order:-1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:.25rem; padding:.55rem .6rem; }
      .stat, .stat:first-child { border:0; padding:.15rem; display:block; text-align:center; font-size:.75rem; }
      .stat strong { display:block; font-size:1.1rem; }
      .hint, .reset { grid-column:1/-1; }
      .hint { min-height:0; margin:.35rem 0 0; font-size:.875rem; line-height:1.4; }
      .hint b { display:inline; margin-right:.4rem; }
      button.reset { margin-top:.5rem; padding:.6rem; min-height:44px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>守护云冈</h1><p class="subtitle">翻开碎片，复原一段石窟记忆。</p></div>
      <div class="badge">云冈石窟 · 探索模式</div>
    </header>
    <section class="scene" aria-label="云冈石窟暮色插画">
      <img src="yungang-grottoes-dusk.png" alt="夕阳映照下的云冈石窟崖壁与佛像插画" />
      <p class="scene-caption">石窟的暮色<small>翻开碎片，唤醒千年雕刻</small></p>
    </section>
    <section class="game" aria-label="云冈石窟记忆配对游戏">
      <div class="board" id="board" aria-label="记忆卡牌"></div>
      <aside aria-live="polite">
        <div class="stat"><span>已修复</span><strong id="pairs">0 / 6</strong></div>
        <div class="stat"><span>翻牌次数</span><strong id="moves">0</strong></div>
        <div class="stat"><span>剩余时间</span><strong id="time">90</strong></div>
        <p class="hint" id="hint"><b>修复提示</b>每次翻开两张石片。找到相同的文化元素，便能使它们重现光彩。</p>
        <button class="reset" id="reset">重新开始</button>
      </aside>
    </section>
    <p class="footer">灵感来自山西大同云冈石窟。牌面与顶部场景均为艺术化创作插画，并非文物实拍或原貌复刻。</p>
    <details class="sources"><summary>查看对应题材的实拍资料</summary><p>可通过以下 Wikimedia Commons 页面，对照了解插画涉及的石窟细节（摄影：Patrick20242023；插画并非对照片的逐像素转换）：<a href="https://commons.wikimedia.org/wiki/File:云冈石窟第三窟佛侧脸部特写.jpg" target="_blank" rel="noopener">佛首侧影</a> · <a href="https://commons.wikimedia.org/wiki/File:云冈石窟第十二窟后室飞天特写.jpg" target="_blank" rel="noopener">飞天</a> · <a href="https://commons.wikimedia.org/wiki/File:云冈石窟第13窟交脚菩萨下方的托举力士.jpg" target="_blank" rel="noopener">托举力士</a> · <a href="https://commons.wikimedia.org/wiki/File:云冈石窟第20窟大佛左侧火焰纹.jpg" target="_blank" rel="noopener">火焰纹</a> · <a href="https://commons.wikimedia.org/wiki/File:云冈石窟第十二窟前殿窟门上的伎乐天特写.jpg" target="_blank" rel="noopener">伎乐天</a> · <a href="https://commons.wikimedia.org/wiki/File:云冈石窟第十二窟前殿左壁下方佛龛特写.jpg" target="_blank" rel="noopener">佛龛雕刻</a>。</p></details>
  </main>
  <script>
    const items = [
      { name:'佛首侧影', image:'card-buddha-profile.png', fact:'近看佛首的侧面，可以辨认眉眼、鼻梁与唇部的石刻线条。' },
      { name:'飞天', image:'card-apsara.png', fact:'飞天形象出现在洞窟雕刻中，以姿态和飘带营造飞翔的动感。' },
      { name:'托举力士', image:'card-guardian.png', fact:'这位力士位于交脚菩萨像下方，双手作托举姿态。' },
      { name:'火焰纹', image:'card-flame.png', fact:'层层翻卷的火焰纹，是造像背光周围常见的装饰细节。' },
      { name:'伎乐天', image:'card-musician.png', fact:'窟门上方的伎乐天雕像，记录了乐舞人物的姿态和衣饰。' },
      { name:'佛龛雕刻', image:'card-niche.png', fact:'佛龛将造像安置在凹入的空间里，龛沿也常饰以细密雕刻。' }
    ];
    const board = document.querySelector('#board'), pairsEl = document.querySelector('#pairs'), movesEl = document.querySelector('#moves'), timeEl = document.querySelector('#time'), hintEl = document.querySelector('#hint');
    let deck, first, second, locked, pairs, moves, remaining, timer, started, gameId=0;
    function shuffle(a) { return a.sort(() => Math.random() - .5); }
    function start() {
      clearInterval(timer); gameId++; first = second = null; locked = started = false; pairs = moves = 0; remaining = 90;
      deck = shuffle([...items, ...items].map((item, i) => ({...item, id:i})));
      board.innerHTML = ''; deck.forEach(card => {
        const el = document.createElement('button'); el.className='card'; el.dataset.name=card.name; el.setAttribute('aria-label','翻开一块石片');
        el.innerHTML = `<span class="face back">✦</span><span class="face front"><img src="${card.image}" alt="" loading="eager"><span class="label">${card.name}</span></span>`;
        el.addEventListener('click', () => reveal(el, card)); board.append(el);
      });
      update(); hintEl.innerHTML='<b>修复提示</b>每次翻开两张石片。找到相同的文化元素，便能使它们重现光彩。';
    }
    function reveal(el, card) {
      if (locked || el.classList.contains('revealed') || el.classList.contains('matched')) return;
      if (!started) { started=true; timer = setInterval(() => { remaining--; update(); if (!remaining) end(false); },1000); }
      el.classList.add('revealed');
      if (!first) { first={el,card}; return; }
      second={el,card}; moves++; locked=true; update(); const round=gameId;
      if (first.card.name===second.card.name) {
        setTimeout(() => { if (round!==gameId) return; first.el.classList.replace('revealed','matched'); second.el.classList.replace('revealed','matched'); pairs++; hintEl.innerHTML=`<b>${card.name} · 已修复</b>${card.fact}`; first=second=null; locked=false; update(); if(pairs===items.length) end(true); }, 480);
      } else setTimeout(() => { if (round!==gameId) return; first.el.classList.remove('revealed'); second.el.classList.remove('revealed'); first=second=null; locked=false; }, 720);
    }
    function update() { pairsEl.textContent=`${pairs} / 6`; movesEl.textContent=moves; timeEl.textContent=remaining; }
    function end(win) { clearInterval(timer); locked=true; hintEl.innerHTML = win ? `<b class="win">修复完成！</b>你用 ${moves} 次翻牌复原了六组石窟记忆。` : '<b>时间到了</b>石窟记忆仍在等待修复。再试一次吧。'; }
    document.querySelector('#reset').addEventListener('click',start); start();
  </script>
</body>
</html>
